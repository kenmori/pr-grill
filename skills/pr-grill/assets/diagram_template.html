<!doctype html>
<html lang="en">

<title>{{BRANCH}} — pr-grill diagram</title>
<style>

  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  figure { margin: 0 0 28px; }
  svg { max-width: 100%; height: auto; display: block; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  figcaption { margin-top: 10px; font-size: 14px; }
  .accent { color: var(--accent); }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<main>
  <h1>{{TITLE: one line naming the mechanism}}</h1>
  <p class="meta">{{BRANCH}} · generated by pr-grill · the figure and PR_QA.md cite the same path:line</p>

  <figure>
    <svg viewBox="0 0 760 240" role="img" aria-label="{{CLAIM: the one sentence this figure shows}}">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
        </marker>
      </defs>
      <!-- SVG: nodes are rect + text, edges are line/path with marker-end="url(#arrow)" and a text label;
           use stroke="currentColor"; the one element the change hinges on uses class="accent" and stroke="currentColor" inside a <g class="accent">;
           a removed edge is stroke-dasharray="6 4"; put path:line under each node in the muted colour -->
    </svg>
    <figcaption>{{CAPTION: the claim in one sentence, plus what the dashed / accented marks mean if used}}</figcaption>
  </figure>
</main>
