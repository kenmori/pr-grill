name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: style

  fixture:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # macOS は /bin/bash が 3.2。Homebrew の bash ではなくこちらで動くことを確認する
      - run: /bin/bash --version | head -1
      - run: /bin/bash tests/fixture.sh
